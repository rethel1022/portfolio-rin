<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sample banner set</title>
  <desc id="desc">Three original banner samples for EC, public relations, and web operation portfolio pages.</desc>
  <defs>
    <linearGradient id="bannerA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#dff0ed"/>
    </linearGradient>
    <linearGradient id="bannerB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#176b6a"/>
    </linearGradient>
    <linearGradient id="bannerC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e7e9"/>
      <stop offset="1" stop-color="#f6edd8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#fbfaf6"/>
  <g filter="url(#shadow)">
    <rect x="96" y="84" width="1208" height="190" rx="18" fill="url(#bannerA)"/>
    <circle cx="1165" cy="178" r="86" fill="#f7e7e9"/>
    <circle cx="1074" cy="222" r="42" fill="#b58a36" opacity="0.24"/>
    <text x="148" y="157" fill="#0f4f55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">京こもの日和</text>
    <text x="148" y="211" fill="#102a43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700">春の着回し特集</text>
    <rect x="782" y="132" width="182" height="64" rx="12" fill="#ffffff" opacity="0.88"/>
    <text x="816" y="173" fill="#176b6a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">EC Banner</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="96" y="316" width="1208" height="190" rx="18" fill="url(#bannerB)"/>
    <path d="M1090 316h214v190h-334c70-35 110-98 120-190Z" fill="#ffffff" opacity="0.12"/>
    <text x="148" y="391" fill="#dff0ed" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">HibiNote Biz</text>
    <text x="148" y="444" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">問い合わせから導入まで整理</text>
    <rect x="916" y="376" width="220" height="66" rx="12" fill="#ffffff"/>
    <text x="958" y="418" fill="#17324d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">PR Sample</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="96" y="548" width="1208" height="190" rx="18" fill="url(#bannerC)"/>
    <rect x="1028" y="590" width="108" height="108" rx="18" fill="#ffffff" opacity="0.74"/>
    <path d="M1056 659c18-46 39-68 63-68 27 0 45 25 68 68Z" fill="#dff0ed"/>
    <circle cx="1182" cy="612" r="18" fill="#b58a36" opacity="0.36"/>
    <text x="148" y="623" fill="#7a4d56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">plus closet</text>
    <text x="148" y="676" fill="#102a43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">更新前チェックでミスを防ぐ</text>
    <rect x="760" y="611" width="210" height="58" rx="12" fill="#176b6a"/>
    <text x="805" y="648" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Ops Banner</text>
  </g>
